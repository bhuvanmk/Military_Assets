spring.application.name=military-asset-management-backend-test

# Use in-memory H2 database for isolated JUnit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable data.sql and DataInitializer during test execution
spring.sql.init.mode=never
app.seed.enabled=false

# Test JWT Secret
jwt.secret=8c6f1d9e2a4b7c0d3e5f8a1b4c7d0e3f6a9b2c5d8e1f4a7b0c3d6e9f2a5b8c1d4e7f0a3b6c9d2e5f8a1b4c7d0e3f6a9b
jwt.expiration-ms=3600000

cors.allowed-origins=http://localhost:5173
