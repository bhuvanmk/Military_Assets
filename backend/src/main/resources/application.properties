spring.application.name=military-asset-management-backend

# Database Source Configuration (Read from Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Military_Assets_DB?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Bhuvan@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Init / Data Seeding
spring.sql.init.mode=always
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET:8c6f1d9e2a4b7c0d3e5f8a1b4c7d0e3f6a9b2c5d8e1f4a7b0c3d6e9f2a5b8c1d}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Server Config
server.port=8080
server.error.include-message=always

# CORS Allowed Origins (Defaults to allow all common origins and wildcards)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*.vercel.app,https://military-assets-chi.vercel.app,*}
